name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forum-dcr2026-production
  cancel-in-progress: false

jobs:
  verify:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to forum.dcr2026.com
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://forum.dcr2026.com
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
      SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create deployment archive
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.env \
            --exclude='.env.*' \
            -czf "$RUNNER_TEMP/forum-dcr2026.tar.gz" .

          cp "$RUNNER_TEMP/forum-dcr2026.tar.gz" forum-dcr2026.tar.gz

      - name: Configure verified SSH connection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          install -d -m 700 "$HOME/.ssh"
          if [ "$DEPLOY_PORT" = "22" ]; then
            host_pattern="$DEPLOY_HOST"
          else
            host_pattern="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi

          {
            printf '%s %s\n' "$host_pattern" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAl7P4PiSAvCouJGic1IajLWsQ51UaPr4IPBE2lYToWX'
            printf '%s %s\n' "$host_pattern" 'ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBPaPGoVgGBa/3qC4568g4d8SHVO11wG9OD6ERuVK+McEPoOUURcqGlsLvNsx/roPtCORWC/jlYt+HkfK0DxB+GU='
            printf '%s %s\n' "$host_pattern" 'ssh-rsa '
          } > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepare AI runtime configuration
        run: |
          test -n "$DEEPSEEK_API_KEY"
          umask 077
          {
            printf '%s\n' 'DEEPSEEK_ENABLED=true'
            printf 'DEEPSEEK_API_KEY=%s\n' "$DEEPSEEK_API_KEY"
            printf '%s\n' 'DEEPSEEK_BASE_URL=https://api.deepseek.com'
            printf '%s\n' 'DEEPSEEK_DEFAULT_MODEL=deepseek-v4-flash'
            printf '%s\n' 'DEEPSEEK_COMPLEX_MODEL=deepseek-v4-flash'
          } > "$RUNNER_TEMP/deepseek.env"

      - name: Upload release archive
        run: |
          sshpass -e scp \
            -P "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes \
            forum-dcr2026.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/forum-dcr2026-$GITHUB_SHA.tar.gz"
          sshpass -e scp \
            -P "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/deepseek.env" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/forum-dcr2026-$GITHUB_SHA-ai.env"

      - name: Activate release
        run: |
          sshpass -e ssh \
            -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; APP_DIR=/opt/forum-dcr2026; RELEASE_SHA=$GITHUB_SHA; RELEASE_DIR=\$APP_DIR/releases/\$RELEASE_SHA; ARCHIVE_PATH=/tmp/forum-dcr2026-\$RELEASE_SHA.tar.gz; AI_ENV_PATH=/tmp/forum-dcr2026-\$RELEASE_SHA-ai.env; mkdir -p \$RELEASE_DIR; tar -xzf \$ARCHIVE_PATH -C \$RELEASE_DIR; APP_DIR=\$APP_DIR RELEASE_SHA=\$RELEASE_SHA AI_ENV_PATH=\$AI_ENV_PATH DEPLOY_ACTOR=$GITHUB_ACTOR DEPLOY_REPOSITORY=$GITHUB_REPOSITORY bash \$RELEASE_DIR/scripts/deploy-production.sh"
