name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forum-dcr2026-production
  cancel-in-progress: false

jobs:
  verify:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to forum.dcr2026.com
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://forum.dcr2026.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create deployment archive
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.env \
            --exclude='.env.*' \
            -czf forum-dcr2026.tar.gz .

      - name: Upload release archive
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: forum-dcr2026.tar.gz
          target: /tmp/forum-dcr2026-${{ github.sha }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          command_timeout: 10m

      - name: Activate release
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          command_timeout: 25m
          script: |
            set -eu
            APP_DIR=/opt/forum-dcr2026
            RELEASE_SHA=${{ github.sha }}
            RELEASE_DIR="$APP_DIR/releases/$RELEASE_SHA"
            ARCHIVE_PATH="/tmp/forum-dcr2026-$RELEASE_SHA/forum-dcr2026.tar.gz"

            mkdir -p "$RELEASE_DIR"
            tar -xzf "$ARCHIVE_PATH" -C "$RELEASE_DIR"
            APP_DIR="$APP_DIR" RELEASE_SHA="$RELEASE_SHA" \
              bash "$RELEASE_DIR/scripts/deploy-production.sh"
