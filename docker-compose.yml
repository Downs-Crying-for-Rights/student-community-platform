services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/student_community?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - QQ_APP_ID=${QQ_APP_ID}
      - QQ_APP_SECRET=${QQ_APP_SECRET}
      - QQ_BOT_ENABLED=${QQ_BOT_ENABLED:-false}
      - QQ_BOT_EXPECTED_SELF_ID=${QQ_BOT_EXPECTED_SELF_ID}
      - QQ_IDENTITY_ENCRYPTION_KEY=${QQ_IDENTITY_ENCRYPTION_KEY}
      - QQ_IDENTITY_HMAC_KEY=${QQ_IDENTITY_HMAC_KEY}
      - QQ_GRANT_HMAC_KEY=${QQ_GRANT_HMAC_KEY}
      - QQ_IDENTITY_KEY_VERSION=${QQ_IDENTITY_KEY_VERSION:-1}
      - QQ_GRANT_TTL_SECONDS=${QQ_GRANT_TTL_SECONDS:-900}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - SMS_TEST_MODE=${SMS_TEST_MODE}
      - ALIBABA_CLOUD_ACCESS_KEY_ID=${ALIBABA_CLOUD_ACCESS_KEY_ID}
      - ALIBABA_CLOUD_ACCESS_KEY_SECRET=${ALIBABA_CLOUD_ACCESS_KEY_SECRET}
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME}
      - ALIYUN_SMS_TEMPLATE_LOGIN=${ALIYUN_SMS_TEMPLATE_LOGIN}
      - ALIYUN_SMS_TEMPLATE_CHANGE_PHONE=${ALIYUN_SMS_TEMPLATE_CHANGE_PHONE}
      - ALIYUN_SMS_TEMPLATE_RESET_PASSWORD=${ALIYUN_SMS_TEMPLATE_RESET_PASSWORD}
      - ALIYUN_SMS_TEMPLATE_BIND_NEW_PHONE=${ALIYUN_SMS_TEMPLATE_BIND_NEW_PHONE}
      - ALIYUN_SMS_TEMPLATE_VERIFY_BOUND_PHONE=${ALIYUN_SMS_TEMPLATE_VERIFY_BOUND_PHONE}
      - ALIYUN_SMS_ENDPOINT=${ALIYUN_SMS_ENDPOINT:-dypnsapi.aliyuncs.com}
      - ALIYUN_SMS_CONNECT_TIMEOUT_MS=${ALIYUN_SMS_CONNECT_TIMEOUT_MS:-5000}
      - ALIYUN_SMS_READ_TIMEOUT_MS=${ALIYUN_SMS_READ_TIMEOUT_MS:-5000}
      - OSS_REGION=${OSS_REGION}
      - OSS_BUCKET=${OSS_BUCKET}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
      - OSS_ENDPOINT=${OSS_ENDPOINT}
      - OSS_CDN_DOMAIN=${OSS_CDN_DOMAIN}
      - TERMINAL_LOG_DIR=/var/log/forum
      - APP_RELEASE=${APP_RELEASE:-unknown}
      - TELEMETRY_SERVER_SAMPLE_RATE=${TELEMETRY_SERVER_SAMPLE_RATE:-0.2}
      - DEEPSEEK_ENABLED=${DEEPSEEK_ENABLED:-false}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_DEFAULT_MODEL=${DEEPSEEK_DEFAULT_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_COMPLEX_MODEL=${DEEPSEEK_COMPLEX_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_TIMEOUT_MS=${DEEPSEEK_TIMEOUT_MS:-25000}
      - DEEPSEEK_MAX_INPUT_CHARS=${DEEPSEEK_MAX_INPUT_CHARS:-12000}
      - DEEPSEEK_MAX_OUTPUT_TOKENS=${DEEPSEEK_MAX_OUTPUT_TOKENS:-1800}
      - SYSTEM_SECRET_ENCRYPTION_KEY=${SYSTEM_SECRET_ENCRYPTION_KEY}
      - NODE_ENV=production
    volumes:
      - ${HOST_TERMINAL_LOG_DIR:-/opt/forum-dcr2026/shared/logs}:/var/log/forum:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  qq-bot:
    profiles: ["qq-bot"]
    build:
      context: ./bot
      dockerfile: Dockerfile
    environment:
      - ONEBOT_WS_URL=${ONEBOT_WS_URL}
      - ONEBOT_ACCESS_TOKEN=${ONEBOT_ACCESS_TOKEN}
      - ONEBOT_EXPECTED_SELF_ID=${QQ_BOT_EXPECTED_SELF_ID}
      - INTERNAL_API_BASE_URL=http://web:3000
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - HEALTH_HOST=0.0.0.0
      - HEALTH_PORT=8081
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: student_community
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
