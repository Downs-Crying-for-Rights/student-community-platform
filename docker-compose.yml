services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/student_community?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - QQ_APP_ID=${QQ_APP_ID}
      - QQ_APP_SECRET=${QQ_APP_SECRET}
      - SMS_TEST_MODE=${SMS_TEST_MODE}
      - OSS_REGION=${OSS_REGION}
      - OSS_BUCKET=${OSS_BUCKET}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
      - OSS_ENDPOINT=${OSS_ENDPOINT}
      - OSS_CDN_DOMAIN=${OSS_CDN_DOMAIN}
      - TERMINAL_LOG_DIR=/var/log/forum
      - APP_RELEASE=${APP_RELEASE:-unknown}
      - TELEMETRY_SERVER_SAMPLE_RATE=${TELEMETRY_SERVER_SAMPLE_RATE:-0.2}
      - DEEPSEEK_ENABLED=${DEEPSEEK_ENABLED:-false}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_DEFAULT_MODEL=${DEEPSEEK_DEFAULT_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_COMPLEX_MODEL=${DEEPSEEK_COMPLEX_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_TIMEOUT_MS=${DEEPSEEK_TIMEOUT_MS:-25000}
      - DEEPSEEK_MAX_INPUT_CHARS=${DEEPSEEK_MAX_INPUT_CHARS:-12000}
      - DEEPSEEK_MAX_OUTPUT_TOKENS=${DEEPSEEK_MAX_OUTPUT_TOKENS:-1800}
      - NODE_ENV=production
    volumes:
      - ${HOST_TERMINAL_LOG_DIR:-/opt/forum-dcr2026/shared/logs}:/var/log/forum:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: student_community
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
